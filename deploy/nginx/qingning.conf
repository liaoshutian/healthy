# 小程序要求 HTTPS。证书放在 deploy/certs/（腾讯云 SSL 免费证书下载 Nginx 版本即可）。
server {
    listen 80;
    server_name api.rexliao.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.rexliao.cn;

    ssl_certificate     /etc/nginx/certs/api.rexliao.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/api.rexliao.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # AI 识别可能要几十秒
    }
}
